<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF → Word Médical</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      color: #1a202c;
    }

    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 2.5rem;
      width: 100%;
      max-width: 640px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #2b6cb0;
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #718096;
      margin-bottom: 2rem;
    }

    #drop-zone {
      border: 2.5px dashed #bee3f8;
      border-radius: 12px;
      background: #ebf8ff;
      padding: 3rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    #drop-zone.drag-over {
      border-color: #3182ce;
      background: #bee3f8;
    }

    #drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .drop-icon { font-size: 3rem; margin-bottom: 0.75rem; }

    .drop-text { font-size: 1rem; color: #4a5568; }
    .drop-hint { font-size: 0.8rem; color: #a0aec0; margin-top: 0.3rem; }

    #file-list {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .file-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 0.6rem 0.9rem;
      font-size: 0.875rem;
    }

    .file-item .file-name { flex: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-item .file-size { color: #a0aec0; font-size: 0.8rem; white-space: nowrap; }
    .file-item .remove-btn {
      background: none; border: none; cursor: pointer;
      color: #e53e3e; font-size: 1rem; padding: 0 2px;
      line-height: 1; flex-shrink: 0;
    }

    .actions {
      margin-top: 1.5rem;
      display: flex;
      gap: 0.75rem;
    }

    #convert-btn {
      flex: 1;
      background: #3182ce;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.8rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    #convert-btn:hover:not(:disabled) { background: #2b6cb0; }
    #convert-btn:disabled { background: #90cdf4; cursor: not-allowed; }

    #clear-btn {
      background: #fff;
      color: #e53e3e;
      border: 1.5px solid #fed7d7;
      border-radius: 8px;
      padding: 0.8rem 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    #clear-btn:hover { background: #fff5f5; }

    #status {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }

    #status.loading { background: #ebf8ff; color: #2b6cb0; display: block; }
    #status.error { background: #fff5f5; color: #e53e3e; display: block; }
    #status.success { background: #f0fff4; color: #276749; display: block; }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #90cdf4;
      border-top-color: #3182ce;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <h1>📄 PDF → Word Médical</h1>
    <p class="subtitle">Glissez vos bilans biologiques et comptes rendus d'imagerie pour les convertir en un seul fichier Word.</p>

    <div id="drop-zone">
      <input type="file" id="file-input" accept=".pdf" multiple />
      <div class="drop-icon">📂</div>
      <div class="drop-text">Glissez vos fichiers PDF ici</div>
      <div class="drop-hint">ou cliquez pour sélectionner — plusieurs fichiers acceptés</div>
    </div>

    <div id="file-list"></div>

    <div class="actions" id="actions" style="display:none">
      <button id="convert-btn" onclick="convert()">⬇ Convertir en Word</button>
      <button id="clear-btn" onclick="clearAll()">Vider</button>
    </div>

    <div id="status"></div>
  </div>

  <script>
    let files = [];

    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const fileList = document.getElementById('file-list');
    const actions = document.getElementById('actions');
    const status = document.getElementById('status');

    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      addFiles([...e.dataTransfer.files]);
    });

    fileInput.addEventListener('change', () => {
      addFiles([...fileInput.files]);
      fileInput.value = '';
    });

    function addFiles(newFiles) {
      const pdfs = newFiles.filter(f => f.type === 'application/pdf' || f.name.endsWith('.pdf'));
      if (pdfs.length < newFiles.length) {
        showStatus('Seuls les fichiers PDF sont acceptés.', 'error');
      }
      files = [...files, ...pdfs];
      renderList();
    }

    function renderList() {
      fileList.innerHTML = '';
      files.forEach((f, i) => {
        const item = document.createElement('div');
        item.className = 'file-item';
        item.innerHTML = `
          <span>📄</span>
          <span class="file-name" title="${f.name}">${f.name}</span>
          <span class="file-size">${(f.size / 1024).toFixed(0)} Ko</span>
          <button class="remove-btn" onclick="removeFile(${i})" title="Supprimer">✕</button>
        `;
        fileList.appendChild(item);
      });
      actions.style.display = files.length ? 'flex' : 'none';
      if (files.length) hideStatus();
    }

    function removeFile(i) {
      files.splice(i, 1);
      renderList();
    }

    function clearAll() {
      files = [];
      renderList();
      hideStatus();
    }

    async function convert() {
      if (!files.length) return;
      const btn = document.getElementById('convert-btn');
      btn.disabled = true;
      showStatus('<span class="spinner"></span>Conversion en cours…', 'loading');

      try {
        const form = new FormData();
        files.forEach(f => form.append('pdfs', f));

        const resp = await fetch('/convert', { method: 'POST', body: form });

        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          throw new Error(err.error || 'Erreur serveur');
        }

        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'documents_medicaux.docx';
        a.click();
        URL.revokeObjectURL(url);

        showStatus(`✅ Fichier Word téléchargé — ${files.length} PDF converti${files.length > 1 ? 's' : ''}.`, 'success');
      } catch (e) {
        showStatus('❌ ' + e.message, 'error');
      } finally {
        btn.disabled = false;
      }
    }

    function showStatus(msg, type) {
      status.innerHTML = msg;
      status.className = type;
    }

    function hideStatus() {
      status.className = '';
      status.style.display = 'none';
    }
  </script>
</body>
</html>
